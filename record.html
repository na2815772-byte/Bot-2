<!-- TEXT BUTTON STYLE -->

<style>

.text-page-button {

    width: 60%;
    max-width: 400px;
    min-width: 250px;

    height: 58px;

    margin: 22px auto 0;

    padding: 10px 16px;

    display: flex;
    align-items: center;
    gap: 12px;

    text-decoration: none;
    color: #ffffff;

    border: 1px solid rgba(0, 220, 255, 0.45);

    border-radius: 16px;

    background:
        linear-gradient(
            120deg,
            #071a2e,
            #004b70,
            #006eff,
            #6500d4,
            #071a2e
        );

    background-size: 300% 300%;

    animation:
        textButtonColor 6s ease infinite;

    box-shadow:
        0 7px 24px rgba(0, 0, 0, 0.30),
        0 0 18px rgba(0, 200, 255, 0.15);

    position: relative;

    overflow: hidden;

    cursor: pointer;

    transition:
        transform 0.3s ease,
        box-shadow 0.3s ease,
        border-color 0.3s ease;

}


@keyframes textButtonColor {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }

}


.text-page-button::before {

    content: "";

    position: absolute;

    top: 0;
    left: -120%;

    width: 70%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,0.28),
            transparent
        );

    transform: skewX(-20deg);

    animation:
        textButtonShine 4s infinite;

}


@keyframes textButtonShine {

    0% {
        left: -120%;
    }

    45% {
        left: 130%;
    }

    100% {
        left: 130%;
    }

}


.text-page-button:hover {

    transform: translateY(-3px);

    border-color:
        rgba(255,255,255,0.80);

    box-shadow:
        0 10px 30px rgba(0,0,0,0.40),
        0 0 25px rgba(0,200,255,0.25);

}


.text-page-button:active {

    transform: scale(0.97);

}


.text-page-icon {

    width: 38px;
    height: 38px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 11px;

    background:
        rgba(255,255,255,0.14);

    font-size: 19px;

    flex-shrink: 0;

    position: relative;

    z-index: 2;

}


.text-page-content {

    display: flex;

    flex-direction: column;

    flex: 1;

    text-align: left;

    position: relative;

    z-index: 2;

}


.text-page-content strong {

    font-size: 15px;

    letter-spacing: 1.5px;

}


.text-page-content small {

    margin-top: 3px;

    font-size: 10px;

    opacity: 0.70;

}


.text-page-arrow {

    font-size: 23px;

    opacity: 0.85;

    position: relative;

    z-index: 2;

    transition:
        transform 0.3s ease;

}


.text-page-button:hover
.text-page-arrow {

    transform:
        translateX(6px);

}


@media (max-width: 600px) {

    .text-page-button {

        width: 70%;

        min-width: 230px;

        height: 55px;

        padding: 9px 13px;

    }

    .text-page-icon {

        width: 35px;
        height: 35px;

        font-size: 17px;

    }

}


/* =========================================================
   MALE / FEMALE VOICE SELECTOR
========================================================= */

.voice-selector {

    width: 100%;

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 38px;

    margin: 16px auto 4px;

}


.voice-option {

    display: flex;

    align-items: center;

    gap: 7px;

    color: #ffffff;

    font-size: 14px;

    font-weight: 600;

    cursor: pointer;

    user-select: none;

    transition:
        transform 0.25s ease,
        text-shadow 0.25s ease;

}


.voice-option:hover {

    transform: translateY(-2px);

    text-shadow:
        0 0 10px rgba(0, 174, 255, 0.9);

}


/* Hide original radio */

.voice-option input {

    position: absolute;

    opacity: 0;

    pointer-events: none;

}


/* Empty square */

.voice-check {

    width: 16px;
    height: 16px;

    border: 2px solid #00bfff;

    border-radius: 4px;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    background:
        rgba(0, 100, 255, 0.10);

    box-shadow:
        0 0 8px rgba(0, 170, 255, 0.25);

    transition:
        all 0.25s ease;

}


/* Tick */

.voice-option input:checked
+ .voice-check {

    background:
        linear-gradient(
            135deg,
            #007bff,
            #00c6ff
        );

    border-color:
        #00eaff;

    box-shadow:
        0 0 12px rgba(0, 200, 255, 0.85);

}


.voice-option input:checked
+ .voice-check::after {

    content: "✓";

    color: #ffffff;

    font-size: 12px;

    font-weight: 900;

}


.voice-option:active {

    transform: scale(0.94);

}

</style>

</head>

<!-- =========================================================
     MALE / FEMALE VOICE LOGIC
========================================================= -->

<script>

let selectedVoiceGender =
    localStorage.getItem(
        "neloy_voice_gender"
    ) || "female";


/* Select saved option */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        const female =
            document.getElementById(
                "femaleVoice"
            );

        const male =
            document.getElementById(
                "maleVoice"
            );


        if (
            selectedVoiceGender ===
            "male"
        ) {

            male.checked = true;

        } else {

            female.checked = true;

        }


        if (female) {

            female.addEventListener(
                "change",
                () => {

                    if (female.checked) {

                        selectedVoiceGender =
                            "female";

                        localStorage.setItem(
                            "neloy_voice_gender",
                            "female"
                        );

                    }

                }
            );

        }


        if (male) {

            male.addEventListener(
                "change",
                () => {

                    if (male.checked) {

                        selectedVoiceGender =
                            "male";

                        localStorage.setItem(
                            "neloy_voice_gender",
                            "male"
                        );

                    }

                }
            );

        }

    }
);


/*
   Replace only the speech function.

   The existing AI logic remains unchanged.
*/

function speak(text) {

    if (
        !("speechSynthesis" in window)
    ) {
        return;
    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        answerLanguage === "bangla"
            ? "bn-BD"
            : "en-US";


    utterance.rate = 1.2;

    utterance.pitch =
        selectedVoiceGender === "male"
            ? 0.75
            : 1.15;

    utterance.volume = 1;


    const voices =
        window.speechSynthesis.getVoices();


    const englishVoices =
        voices.filter(
            voice =>
                voice.lang
                    .toLowerCase()
                    .startsWith("en")
        );


    if (
        englishVoices.length
    ) {

        let selectedVoice;


        if (
            selectedVoiceGender ===
            "male"
        ) {

            selectedVoice =
                englishVoices.find(
                    voice =>
                        /male|david|mark|daniel|alex|fred|george/i
                            .test(
                                voice.name
                            )
                );

        } else {

            selectedVoice =
                englishVoices.find(
                    voice =>
                        /female|samantha|victoria|karen|zira|susan|ava/i
                            .test(
                                voice.name
                            )
                );

        }


        if (
            selectedVoice
        ) {

            utterance.voice =
                selectedVoice;

        }

    }


    window.speechSynthesis.speak(
        utterance
    );

}

</script>
