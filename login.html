<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Neloy AI</title>

    <link rel="stylesheet" href="style.css">

</head>

<body data-page="login">

    <div class="background">
        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>
        <div class="glow glow-three"></div>
    </div>

    <div id="particles"></div>

    <main class="center-page">

        <section class="glass-card form-card">

            <div class="mini-logo">
                N
            </div>

            <div class="form-heading">

                <div class="status-badge">
                    SECURE ACCESS
                </div>

                <h1>
                    Welcome Back
                </h1>

                <p>
                    Login to access Neloy AI.
                </p>

            </div>

            <form id="loginForm">

                <div class="input-group">

                    <label for="loginEmail">
                        Email
                    </label>

                    <input
                        id="loginEmail"
                        type="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="input-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        id="loginPassword"
                        type="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <div
                    id="loginStatus"
                    class="message-box"
                ></div>

                <button
                    type="submit"
                    class="main-button"
                >
                    <span>Login</span>
                    <span>→</span>
                </button>

            </form>

            <div class="form-footer">

                Don't have an account?

                <a href="registration.html">
                    Create Account
                </a>

            </div>

            <a
                href="index.html"
                class="back-link"
            >
                ← Back to Home
            </a>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
